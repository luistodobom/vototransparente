name: Build & deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *" # daily refresh from the Parliament's open data
  workflow_dispatch:
    inputs:
      summarize:
        description: "Generate AI summaries for new initiatives (needs GEMINI_API_KEY secret)"
        type: boolean
        default: true

permissions:
  contents: write # commit new summaries back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache open-data downloads
        uses: actions/cache@v4
        with:
          path: data/raw/opendata
          key: opendata-${{ github.run_id }}
          restore-keys: opendata-

      - name: Fetch official open data
        run: python -m pipeline.fetch_opendata --force || python -m pipeline.fetch_opendata

      - name: Fetch MP roster (Informação Base)
        run: python -m pipeline.fetch_deputies --force || python -m pipeline.fetch_deputies

      - name: Cache XIV 1st-session initiative pages
        uses: actions/cache@v4
        with:
          path: data/raw/xiv_s1_html
          key: xiv-s1-html-${{ github.run_id }}
          restore-keys: xiv-s1-html-

      - name: Scrape XIV 1st session (missing from open data)
        continue-on-error: true
        run: python -m pipeline.fetch_xiv_session1

      - name: Normalize votes
        run: python -m pipeline.normalize

      - name: Summarize new initiatives (Gemini)
        if: env.GEMINI_API_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.summarize)
        continue-on-error: true
        run: |
          python -m pipeline.fetch_texts --unsummarized
          python -m pipeline.summarize --concurrency 16
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summaries
          git diff --cached --quiet || (git commit -m "Add AI summaries for new initiatives" && git push)

      - name: Cache attendance pages
        uses: actions/cache@v4
        with:
          path: data/raw/attendance
          key: attendance-${{ github.run_id }}
          restore-keys: attendance-

      - name: Fetch plenary attendance (presenças)
        continue-on-error: true
        run: python -m pipeline.fetch_attendance

      - name: MP photo thumbnails for new MPs
        continue-on-error: true
        run: python -m pipeline.fetch_photos

      - name: Attribute votes to individual MPs
        run: python -m pipeline.mp_votes

      - name: Record data provenance
        run: python -m pipeline.provenance

      - name: Export site data
        run: python -m pipeline.export_site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
