name: Update data

# Daily data refresh: re-downloads only what can still change (the current legislature's open data,
# roster and recent plenary attendance), summarizes new initiatives with Gemini, regenerates the site data,
# and — only if votes, MPs, attendance or summaries actually changed — commits to main and redeploys.
# Closed legislatures come from the actions cache (open-data dumps) or from the repo (data/scraped/).
on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Legislatures
        id: leg
        run: |
          echo "current=$(python -m pipeline.config --current)" >> "$GITHUB_OUTPUT"
          echo "all=$(python -m pipeline.config | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # Open-data dumps of closed legislatures never change: keep them in the actions cache.
      # The key only changes when the list of legislatures does; the current one is re-downloaded every run.
      - name: Restore open-data cache
        uses: actions/cache@v4
        with:
          path: data/raw/opendata
          key: opendata-${{ steps.leg.outputs.all }}-v1

      - name: Fetch open data (current legislature refreshed)
        run: python -m pipeline.fetch_opendata --refresh ${{ steps.leg.outputs.current }}

      - name: Fetch MP roster (current legislature refreshed)
        run: python -m pipeline.fetch_deputies --refresh ${{ steps.leg.outputs.current }} --no-check

      - name: Normalize votes
        run: python -m pipeline.normalize

      - name: Fetch attendance (incremental)
        run: python -m pipeline.fetch_attendance

      - name: Fetch photos of new MPs
        run: python -m pipeline.fetch_photos

      - name: Fetch texts of initiatives without a summary
        continue-on-error: true
        timeout-minutes: 20
        run: python -m pipeline.fetch_texts --unsummarized --limit 300

      - name: Summarize new initiatives
        continue-on-error: true
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.summarize --concurrency 16 --limit 300

      - name: Attribute MP votes
        run: python -m pipeline.mp_votes

      - name: Provenance
        run: python -m pipeline.provenance

      - name: Export site data
        run: python -m pipeline.export_site

      - name: Commit if data changed
        id: commit
        run: |
          # Paths whose changes matter. meta.json (and the provenance timestamps inside it) changes on every
          # run, so it is committed along with real changes but never triggers a commit on its own.
          meaningful=(
            site/src/data/initiatives.json
            site/src/data/mpvotes.json
            site/src/data/deputies.json
            site/src/data/attendance.json
            site/src/data/parties.json
            site/public/data
            data/summaries
            data/scraped
            site/public/img/mp
          )
          git status --porcelain -- "${meaningful[@]}"
          if [ -z "$(git status --porcelain -- "${meaningful[@]}")" ]; then
            echo "No meaningful data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/src/data site/public/data data/summaries data/scraped site/public/img/mp
          git commit -m "Daily data update ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
